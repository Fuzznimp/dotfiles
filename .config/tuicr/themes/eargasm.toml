# Palette mirrors the ghostty config (.config/ghostty/config).
# Keys ghostty has no equivalent for (surface greys, diff backgrounds) are derived:
# greys lifted off background, diff backgrounds are palette green/red scaled down.
panel_bg = "#202020"
bg_highlight = "#2d2d2d"
fg_primary = "#dfbf8e"
fg_secondary = "#928374"
fg_dim = "#665c54"

diff_add = "#a9b665"
